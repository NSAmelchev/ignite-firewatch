# Settings of the Firewatch controller. Every line shows the default: uncomment one to change it.
# An environment variable overrides a line (data.dir -> IGNITE_FIREWATCH_DATA_DIR), and a system property overrides both
# (-Dignite.firewatch.data.dir). IGNITE_FIREWATCH_CONFIG names another file. What the UI changes at run time (auto-run,
# limits, the stand) lives in the database, not here. In Docker this directory is mounted into the container, whose
# paths and port are fixed by the image: the port on the host is IGNITE_FIREWATCH_UI_PORT of docker/deploy.env.

# HTTP port of the UI and the API, and the address it listens on.
#port = 8090
#bind.host = 0.0.0.0

# SQLite database and run results (keep them), git mirror, Maven repository and builds (can be wiped).
#data.dir = data
#cache.dir = cache

# The repository and the branch a new stand follows; the setup wizard and Settings change them later.
#repo.url = https://github.com/apache/ignite.git
#branch = master

# Tools: java of the benchmark JVMs (default: the one running the controller) and Maven for the builds.
# harness.jar is found next to controller.jar (libs/ of the distribution), in the repository in modules/harness/target.
#java =
#mvn = mvn
#harness.jar =

# Maven of the builds of Ignite commits. maven.settings is a settings.xml for every build (-s): mirrors, proxies and
# credentials of a repository manager, the way to build without internet access. A relative path starts in the directory
# of the application; in Docker put the file into config/, which the container sees. maven.args go to every mvn call,
# separated by spaces, after the options of the application, e.g. -o with a filled cache, -gs FILE, -Dkey=value.
#maven.settings = config/maven-settings.xml
#maven.args =

# Memory and time limits.
#maven.heap.mb = 1536
#harness.heap.mb = 128
#build.timeout.min = 25
#fetch.timeout.min = 30
#phase.grace.sec = 120

# The ssh key and known_hosts file of remote hosts (empty: whatever ssh finds itself).
#ssh.key =
#ssh.known.hosts =

# Development: release jars of Ignite instead of building each commit.
#fake.build = 0
#fake.libs.dir = modules/harness/target/dev-libs
