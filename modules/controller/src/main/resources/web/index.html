<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firewatch</title>
<link rel="stylesheet" href="/vendor/uPlot.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="brand" href="#/dashboard" title="Firewatch: performance watch for Apache Ignite master">🔥 Firewatch</a>
  <nav>
    <a href="#/dashboard" data-view="dashboard">Dashboard</a>
    <a href="#/timeline" data-view="timeline">Timeline</a>
    <a href="#/commits" data-view="commits">Commits</a>
    <a href="#/compare" data-view="compare">Compare</a>
    <a href="#/bisects" data-view="bisects">Bisects <span id="bisect-count" class="nav-count" title="active bisections"></span></a>
    <a href="#/queue" data-view="queue">Queue <span id="queue-count" class="nav-count" title="jobs running and waiting"></span></a>
    <a href="#/noise" data-view="noise" class="push">Noise</a>
    <a href="#/scenarios" data-view="scenarios">Scenarios</a>
    <a href="#/settings" data-view="settings">Settings</a>
  </nav>
  <div class="search">
    <input id="search" type="search" placeholder="sha, IGNITE-123, #PR, job" title="press / to jump here" autocomplete="off" spellcheck="false">
    <div id="search-results" class="search-results" hidden></div>
  </div>
</header>
<main id="app"></main>
<script src="/vendor/uPlot.iife.min.js"></script>
<script src="/charts.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
